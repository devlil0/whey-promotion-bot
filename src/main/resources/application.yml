spring:
  application:
    name: whey_promotion_bot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/whey_db}
    username: ${SPRING_DATASOURCE_USERNAME:whey_user}
    password: ${SPRING_DATASOURCE_PASSWORD:whey_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

growth:
  api:
    base-url: https://www.gsuplementos.com.br
    app-token: wapstore

darklab:
  api:
    base-url: https://darklabsuplementos.com.br

profitlabs:
  api:
    base-url: https://profitlabs.commercesuite.com.br

external:
  api:
    connect-timeout-ms: 10000
    response-timeout-ms: 20000

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:-5080521415}

api:
  key: ${API_KEY:}

promotion:
  discount-threshold: 0.05
  history-days: 7
  min-history-samples: 3
